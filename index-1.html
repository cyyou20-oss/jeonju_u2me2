:root{--paper:#F2F3EE;--sheet:#fff;--ink:#1E2430;--ink-2:#4F5866;--line:#D9DCD3;--indigo:#23395B;--err:#B9442E;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--paper:#15181E;--sheet:#1E232B;--ink:#ECEEF0;--ink-2:#A7AFBA;--line:#323944;--indigo:#9DB4DA;--err:#F08C74}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:340px;text-align:center}
img{width:110px;height:110px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
h1{font-family:"SBAggro","Noto Sans KR",sans-serif;font-weight:700;font-size:30px;line-height:1.32;letter-spacing:-.5px;margin:16px 0 22px}
input[type=password]{width:100%;font-size:18px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);text-align:center}
input:focus-visible,button:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
button{width:100%;margin-top:10px;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--indigo);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:15px;color:var(--ink-2)}
label input{width:20px;height:20px}
.msg{min-height:22px;margin-top:12px;font-size:15px;color:var(--err);font-weight:600}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.normalize("NFC")),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const msg=document.getElementById("msg"), go=document.getElementById("go");
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const pw=document.getElementById("pw").value.trim(); if(!pw) return;
  go.disabled=true; go.textContent="여는 중…"; msg.textContent="";
  try{ const html=await unlock(pw);
    try{ if(document.getElementById("rem").checked) localStorage.setItem("jj-pw",pw); else localStorage.removeItem("jj-pw"); }catch(_){}
    show(html);
  }catch(err){ go.disabled=false; go.textContent="열기";
    msg.textContent = (window.crypto&&crypto.subtle) ? "비밀번호가 맞지 않아요" : "이 브라우저에서는 열 수 없어요. 크롬이나 사파리로 열어주세요"; }
});
(async()=>{ let pw=null; try{ pw=localStorage.getItem("jj-pw"); }catch(_){}
  if(pw){ try{ show(await unlock(pw)); }catch(_){ try{localStorage.removeItem("jj-pw");}catch(_){} } } })();
})();
</script></body></html>
